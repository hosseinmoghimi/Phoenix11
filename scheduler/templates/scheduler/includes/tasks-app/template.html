<div id="accordion-tasks" class="rtl text-right farsi">
  <div class="card" id="tasks-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-tasks"
          aria-expanded="true"
          aria-controls="collapse-tasks"
        >
                  
          تسک ها
          <span v-if="tasks.length>0">
            <small class="text-danger mx-2">
              <span v-text="tasks.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-tasks"
      class="collapse {% if expand_tasks %} show {% endif %}"
      aria-labelledby="heading-tasks"
      data-parent="#accordion-tasks"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <th>تسک</th>

              
              <th></th>
            </thead>
            <tbody>
              <tr v-for="task in tasks">
                <td>
               
                  <!-- <div v-for="page in [task]">
                    {% include "core/includes/page-app/media.html" %}
                 </div> -->

                <a :href="task.get_absolute_url">
                  <span v-text="task.title"></span>
                </a>
                     
              </td>
                <td>
                  {% if perms.scheduler.change_task %}
                  <a
                    target="_blank"
                    :href="task.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  {% endif %} {% if perms.scheduler.delete_task %}
                  <a
                    target="_blank"
                    :href="task.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                  {% endif %}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
