{% load to_persian_date %}
<div class="row rtl mt-5">
  {% for blog in blogs %}
  <div class="col-md-4">
    <h4 class="text-right">
      <a href="{{blog.get_absolute_url}}"> {{blog.title}} </a>
    </h4>
    <h6 class="text-right">
        {{blog.start_date|to_persian_datetime|safe}}
        ~
        {{blog.end_date|to_persian_datetime|safe}}
    </h6>
  </div>
  {% endfor %}
</div>
