<div id="accordion-class-students" class="rtl text-right farsi">
  <div class="card" id="class-students-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-class-students"
          aria-expanded="true"
          aria-controls="collapse-class-students"
        >
          
        دانش آموزان
        </button>
      </h5>
    </div>
    <div
      id="collapse-class-students"
      class="collapse "
      aria-labelledby="heading-class-students"
      data-parent="#accordion-class-students"
    >
      <div class="card-body">
       <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <th>
                    ردیف
                </th>
                <th>
                    نام  
                </th>
                
                
                
                <th>
                    نام پدر
                </th>
                <th>
                    کد ملی
                </th>
                <th>

                </th>
            </thead>
            <tbody>
                <template v-for="(student,raw) in students">
                    <class-student-component  :student="student"></class-student-component>
                </template>
               
            </tbody>
        </table>
                
       </div>
      </div>
    </div>
  </div>
</div>
