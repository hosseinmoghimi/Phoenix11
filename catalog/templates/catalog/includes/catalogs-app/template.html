<div id="accordion-catalogs" class="rtl text-right farsi">
  <div class="card" id="catalogs-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-catalogs"
          aria-expanded="true"
          aria-controls="collapse-catalogs"
        >
          کاتالوگ ها
          <span v-if="catalogs.length>0">
            <small class="text-danger mx-2">
              <span v-text="catalogs.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-catalogs"
      class="collapse {% if expand_catalogs %} show {% endif %}"
      aria-labelledby="heading-catalogs"
      data-parent="#accordion-catalogs"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <th>کاتالوگ</th>

              <th></th>
            </thead>
            <tbody>
              <tr v-for="catalog in catalogs">
                <td>
                  <a :href="catalog.get_absolute_url">
                    <span v-text="catalog.title"></span>
                  </a>
                </td>

                <td>
                  {% if perms.catalog.change_catalog %}
                  <a
                    target="_blank"
                    :href="catalog.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  {% endif %} {% if perms.catalog.delete_catalog %}
                  <a
                    target="_blank"
                    :href="catalog.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                  {% endif %}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
