<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{title}} | {{app_title}}</title>
    <link href="{% static 'vendor/css/bootstrap.min.css' %}" rel="stylesheet" />

    {% if farsi_font_name %}
    <link
      href="{{STATIC_URL}}leo/css/font-farsi-{{farsi_font_name}}.css"
      rel="stylesheet"
    />
    {% else %}
    <link href="{% static 'leo/css/font-farsi.css' %}" rel="stylesheet" />
    {% endif %}
     <style>
              label {
                width: 100%;
                text-align: right;
              }
            </style>
            
  </head>
  <body>
    <div class="row rtl">
      <div class="col-md-4"></div>
      <div class="col-md-4 px-4 py-4">
        <div class="card farsi" id="change-password-app">
         <div class="card-header">
            <h5 class="text-center">
                تغییر دادن کلمه عبور
            </h5>
         </div>
            <div class="card-body text-right">
           
            <div class="form-group">
              <label for="">نام کاربری</label>
              <input v-model="username" type="text" class="form-control" />
            </div>

            <div class="form-group">
              <label for="">کلمه عبور فعلی</label>
              <input
                v-model="old_password"
                type="password"
                class="form-control"
              />
            </div>

            <div class="form-group">
              <label for="">کلمه عبور جدید</label>
              <input
                v-model="new_password"
                type="password"
                class="form-control"
              />
            </div>
            <div class="form-group">
              <label for="">تکرار کلمه عبور جدید</label>
              <input
                v-model="new_password2"
                type="password"
                class="form-control"
              />
            </div>
            <div>
              <button
                @click="change_password()"
                class="btn btn-success btn-block"
              >
                تایید
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4"></div>
    </div>

    <script src="{% static 'vendor/js/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'vendor/js/popper.min.js' %}"></script>
    <script src="{% static 'utility/js/message.js' %}"></script>
    <script src="{% static 'utility/js/utility.js' %}"></script>
    <script src="{% static 'dashboard/js/plugins/bootstrap-notify.js' %}"></script>

    <script src="{% static 'persian/moment.js' %}"></script>
    <script src="{% static 'persian/moment-jalaali.js' %}"></script>
    <script src="{% static 'persian/vue-persian-datetime-picker-browser.js' %}"></script>
    
    <script src="{% static 'vendor/js/vue.js' %}"></script>
 

    <script>
      let change_password_app = new Vue({
        el: "#change-password-app",
        data: {
          username: "{{username}}",
          old_password: "12",
          new_password: "15",
          new_password2: "",
        },
        methods:{
            change_password:function(){
                let payload={
                    csrfmiddlewaretoken:csrfmiddlewaretoken,
                    username:this.username,
                    old_password:this.old_password,
                    new_password:this.new_password,
                    new_password2:this.new_password2,
                }
                console.log(payload)
            },
        }
      });
    </script>
</body>
</html>
